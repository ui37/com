<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Store - FNAF Amino</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
        }
        .header {
            background: #34a853;
            color: white;
            padding: 15px 20px;
            font-size: 22px;
            font-weight: bold;
        }
        .app-container {
            background: white;
            margin: 20px auto;
            padding: 20px;
            width: 92%;
            max-width: 500px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .app-icon {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            background: #ddd;
            display: block;
            margin-bottom: 15px;
        }
        .app-title {
            font-size: 24px;
            font-weight: bold;
        }
        .app-sub {
            color: #777;
            margin-bottom: 20px;
        }
        .install-btn {
            background: #1a73e8;
            color: white;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            width: 100%;
        }
        .install-btn:hover {
            background: #0c57c4;
        }
    </style>
</head>
<body>

    <div class="header">Google Play</div>

    <div class="app-container">
        <img class="app-icon" src="https://pm1.aminoapps.com/8703/3c93d4f8851193beba5a263dd6f071a79dce2a5fr1-240-240v2_hq.jpg" alt="Ícone">
        
        <div class="app-title">FNAF Amino</div>
        <div class="app-sub">Comunidade • Social</div>

        <a class="install-btn" href="https://github.com/ui37/com/raw/refs/heads/main/%E2%80%A2FNAF%E2%80%A2.apk">
            Instalar
        </a>
    </div>

</body>
</html>
